[project]
name = "advanced-customer-segmentation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.23.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "shap>=0.46.0",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
